[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlatch"
version = "0.1.0"
description = "Stateful queueing middleware that holds a background agent's message until the user stops talking, then releases it into a live voice session."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daithi Martin", email = "daithi.k.martin@gmail.com" }]
keywords = ["voice", "redis", "middleware", "vad", "asyncio", "webhook", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "redis>=5.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[project.urls]
Homepage = "https://github.com/DaithiMartin/AgentLatch"
Repository = "https://github.com/DaithiMartin/AgentLatch"
Issues = "https://github.com/DaithiMartin/AgentLatch/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.20",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentlatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
